spring.application.name=bookie
server.port=${PORT:8080}

spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookie}
spring.datasource.username=${DATASOURCE_USERNAME:bookie}
spring.datasource.password=${DATASOURCE_PASSWORD:bookie_dev_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=50

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.cache.type=redis
spring.cache.redis.time-to-live=10m

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
